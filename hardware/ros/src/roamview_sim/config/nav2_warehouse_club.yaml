# Nav2 settings for RoamView in the warehouse club.
#
# This file only lists what we change. nav.launch.py loads the nav2_params.yaml that ships with YOUR Nav2
# (share/nav2_bringup/params/nav2_params.yaml) and merges these values on top, so the file keeps working when
# Nav2 renames or adds parameters between releases (Jazzy, Kilted, Lyrical).
# To use a complete file of your own instead: ros2 launch roamview_sim nav.launch.py params_file:=/path/full.yaml

amcl:
  ros__parameters:
    base_frame_id: base_footprint
    laser_max_range: 12.0          # D500 LiDAR range
    max_beams: 120
    sigma_hit: 0.1                 # the map comes from the same geometry the LiDAR sees: trust hits more
    z_hit: 0.8
    z_rand: 0.2                    # (Nav2 defaults 0.2 / 0.5 / 0.5 are for rough SLAM maps)
    # odometry noise: the EKF (wheels + IMU gyro, sim.launch.py ekf:=true) is good to about 1 %, so the particle
    # cloud does not need to spread as much as the Nav2 defaults (0.2) allow. Spreading too much in 25 m long,
    # look-alike aisles is how AMCL ends up in the wrong aisle.
    alpha1: 0.08                   # rotation noise from rotation
    alpha2: 0.03                   # rotation noise from translation
    alpha3: 0.05                   # translation noise from translation
    alpha4: 0.03                   # translation noise from rotation
    set_initial_pose: true         # nav.launch.py fills in the spawn preset (dock, entrance, receiving)
    initial_pose: {x: 1.6, y: 92.0, z: 0.0, yaw: 0.0}

bt_navigator:
  ros__parameters:
    default_server_timeout: 200    # ms to wait for the planner/controller to accept a goal (default 20 is tight
                                   # on a busy PC with a 130 x 100 m map)

controller_server:
  ros__parameters:
    FollowPath:                    # MPPI (the Nav2 default): keep its model inside what the motors can do
      batch_size: 1000             # half the default samples: plenty at 0.5 m/s, and lighter on the CPU
      time_steps: 50
      vx_max: 0.5
      vx_min: -0.3
      ax_max: 0.5
      ax_min: -0.5
      wz_max: 1.5

local_costmap:
  local_costmap:
    ros__parameters:
      width: 4
      height: 4
      robot_radius: 0.22           # encloses RoamView's bumper corners (0.212 m)
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"

global_costmap:
  global_costmap:
    ros__parameters:
      robot_radius: 0.22
      filters: ["keepout_filter"]
      keepout_filter:
        plugin: "nav2_costmap_2d::KeepoutFilter"
        enabled: true
        filter_info_topic: "/costmap_filter_info"

planner_server:
  ros__parameters:
    GridBased:
      use_astar: true              # 130 x 100 m map: A* finds long paths faster than Dijkstra

velocity_smoother:
  ros__parameters:
    max_velocity: [0.5, 0.0, 1.5]
    min_velocity: [-0.3, 0.0, -1.5]
    max_accel: [0.5, 0.0, 2.0]     # the motor firmware limits (sim.launch.py accel / decel)
    max_decel: [-0.5, 0.0, -2.0]

collision_monitor:
  ros__parameters:
    base_frame_id: base_footprint

# ROS 2 Jazzy only: send TwistStamped like Kilted and later do (our Gazebo bridge expects TwistStamped).
# Later releases ignore this parameter.
stamped_cmd_vel_nodes: [bt_navigator, controller_server, behavior_server, velocity_smoother, collision_monitor,
                        docking_server, route_server]
