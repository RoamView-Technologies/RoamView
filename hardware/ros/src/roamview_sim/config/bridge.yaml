# ros_gz_bridge: translates between Gazebo topics (gz_topic_name) and ROS 2 topics (ros_topic_name).
# Gazebo and ROS 2 are two separate message systems; nothing crosses unless it is listed here.

# simulation time: every ROS node started with use_sim_time:=true follows this clock
- ros_topic_name: /clock
  gz_topic_name: /clock
  ros_type_name: rosgraph_msgs/msg/Clock
  gz_type_name: gz.msgs.Clock
  direction: GZ_TO_ROS

# velocity commands in (Nav2 and ROS 2 Kilted+ use TwistStamped)
- ros_topic_name: /cmd_vel
  gz_topic_name: /model/roamview/cmd_vel
  ros_type_name: geometry_msgs/msg/TwistStamped
  gz_type_name: gz.msgs.Twist
  direction: ROS_TO_GZ

# wheel odometry and its transform odom -> base_footprint
- ros_topic_name: /odom
  gz_topic_name: /model/roamview/odometry
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS
- ros_topic_name: /tf
  gz_topic_name: /model/roamview/tf
  ros_type_name: tf2_msgs/msg/TFMessage
  gz_type_name: gz.msgs.Pose_V
  direction: GZ_TO_ROS

# joint angles (wheels, suspension arms, caster swivels) for robot_state_publisher
- ros_topic_name: /joint_states
  gz_topic_name: /model/roamview/joint_states
  ros_type_name: sensor_msgs/msg/JointState
  gz_type_name: gz.msgs.Model
  direction: GZ_TO_ROS

# sensors
- ros_topic_name: /scan
  gz_topic_name: /model/roamview/scan
