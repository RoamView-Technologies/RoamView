- ros_topic_name: /imu
  gz_topic_name: /model/roamview/imu
  ros_type_name: sensor_msgs/msg/Imu
  gz_type_name: gz.msgs.IMU
  direction: GZ_TO_ROS
- ros_topic_name: /cliff/front_left
  gz_topic_name: /model/roamview/cliff_fl
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: /cliff/front_right
  gz_topic_name: /model/roamview/cliff_fr
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: /cliff/rear_left
  gz_topic_name: /model/roamview/cliff_rl
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: /cliff/rear_right
  gz_topic_name: /model/roamview/cliff_rr
  ros_type_name: sensor_msgs/msg/LaserScan
  gz_type_name: gz.msgs.LaserScan
  direction: GZ_TO_ROS
- ros_topic_name: /bumper/left
  gz_topic_name: /model/roamview/bumper_left
  ros_type_name: ros_gz_interfaces/msg/Contacts
  gz_type_name: gz.msgs.Contacts
  direction: GZ_TO_ROS
- ros_topic_name: /bumper/right
  gz_topic_name: /model/roamview/bumper_right
  ros_type_name: ros_gz_interfaces/msg/Contacts
  gz_type_name: gz.msgs.Contacts
  direction: GZ_TO_ROS

# simulator-only truth, to compare with /odom
- ros_topic_name: /ground_truth/odom
  gz_topic_name: /model/roamview/ground_truth
  ros_type_name: nav_msgs/msg/Odometry
  gz_type_name: gz.msgs.Odometry
  direction: GZ_TO_ROS

# OAK-D Pro W (only published when the camera is on; lazy = no work until someone subscribes)
- ros_topic_name: /oak/image
  gz_topic_name: /model/roamview/oak/image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /oak/depth_image
  gz_topic_name: /model/roamview/oak/depth_image
  ros_type_name: sensor_msgs/msg/Image
  gz_type_name: gz.msgs.Image
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /oak/points
  gz_topic_name: /model/roamview/oak/points
  ros_type_name: sensor_msgs/msg/PointCloud2
  gz_type_name: gz.msgs.PointCloudPacked
  direction: GZ_TO_ROS
  lazy: true
- ros_topic_name: /oak/camera_info
  gz_topic_name: /model/roamview/oak/camera_info
  ros_type_name: sensor_msgs/msg/CameraInfo
  gz_type_name: gz.msgs.CameraInfo
  direction: GZ_TO_ROS
  lazy: true
